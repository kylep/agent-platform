name: CI

on:
  push:
  pull_request:

# Least privilege: jobs only need to read the repo.
permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend
        run: pip install -e 'services/backend[dev]'
      - name: Run backend tests
        # Includes the end-to-end SDK exercise (tests/test_sdk_integration.py):
        # the generated client drives the real ASGI app over httpx with a
        # genuine ap_ key — auth, RBAC, typed responses for real — and the
        # platform skill's documented /api paths are held to the live OpenAPI.
        run: pytest services/backend/tests
      - name: SDK is in sync with the API
        # The SDK is generated from the OpenAPI spec; regenerate and fail if the
        # committed output differs, so it can never drift. Generator is pinned.
        run: |
          python sdk/regenerate.py
          git diff --exit-code sdk/ \
            || (echo "::error::sdk/ is stale — run 'python sdk/regenerate.py' and commit" && exit 1)

  runner:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install runner deps
        run: pip install aiokafka pytest pytest-asyncio
      - name: Run runner tests
        run: cd services/runner && python -m pytest test_runner.py

  mcp-facade:
    # The external MCP facade (docs/design/17) generates its tools from the
    # API's own OpenAPI document, so its tests need BOTH the backend (to build
    # the real spec) and fastmcp. Same spec the SDK drift check uses: an API
    # change that would newly expose an excluded endpoint fails here.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend + facade deps
        run: pip install -q -e services/backend -r services/mcp-facade/requirements.txt pytest
      - name: Facade tests
        run: cd services/mcp-facade && python -m pytest -q

  apps:
    # App backends (docs/design/11) — separable from platform code, tested
    # separately. One step per app.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: news app backend tests
        run: |
          pip install -q -r apps/news/backend/requirements.txt aiosqlite pytest pytest-asyncio
          cd apps/news/backend && python -m pytest -q
      - name: stockmarket app backend tests
        run: |
          pip install -q -r apps/stockmarket/backend/requirements.txt aiosqlite pytest pytest-asyncio
          cd apps/stockmarket/backend && python -m pytest -q

  tools:
    # Custom platform tools (docs/design/12): executor invariants + every
    # tool's own tests, run against the union of tool requirements exactly as
    # the executor image bakes them.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Executor tests
        run: |
          pip install -q -r services/tool-executor/requirements.txt pytest
          cd services/tool-executor && python -m pytest -q
      - name: Tool requirements install cleanly (the image bake)
        run: |
          find tools -name requirements.txt -exec pip install -q -r {} \;
      - name: Per-tool tests
        run: |
          shopt -s nullglob
          for t in tools/*/test_run.py; do
            echo "== $t"; (cd "$(dirname "$t")" && python -m pytest -q test_run.py)
          done

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install workspaces and build web
        # npm workspaces: the root install links @ap/ui (packages/ui) into
        # services/web and any apps/*/frontend.
        run: npm ci && cd services/web && npm run build
      - name: Build app frontends
        run: |
          npm run build -w news-frontend
          npm run build -w stockmarket-frontend
      - name: Design-system token gate
        # No raw hex outside packages/ui/src/tokens.css — see packages/ui/README.md
        run: cd services/web && npm run check:tokens
      - name: Storybook builds
        run: cd services/web && npm run build:storybook
      - name: Install Playwright browser
        run: cd services/web && npx playwright install --with-deps chromium
      - name: UI gate — smoke + axe over every page (mocked API)
        # The UI's backpressure: each page must render the production build
        # with zero console errors, zero unfixtured API calls, and no
        # serious/critical axe violations. See services/web/tests/.
        run: cd services/web && npx playwright test

  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - name: Update chart dependencies
        # OCI deps (bitnamicharts) are handled natively by helm 3.8+; no login needed.
        run: helm dependency update charts/agent-platform
      - name: Lint chart
        run: helm lint charts/agent-platform --set env.AP_SESSION_SECRET=x

  secret-scan:
    # GATING backstop for the local pre-commit hooks (.pre-commit-config.yaml):
    # blocks a merge if a secret or a never-commit file slips in without the
    # hooks installed. Prevention still lives client-side (a public push exposes
    # a secret immediately); this catches it on PRs and fails loudly otherwise.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0                       # gitleaks scans full history
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run the same secret hooks as local pre-commit
        # Reuses .pre-commit-config.yaml verbatim (forbid-secret-files +
        # detect-private-key + gitleaks) so CI and dev machines check the exact
        # same things. Fails the build on any finding.
        run: |
          pip install pre-commit
          pre-commit run --all-files --show-diff-on-failure

  security-scan:
    # Supply-chain hardening (M06): scan the repo for vulnerable deps, IaC
    # misconfig, and risky code patterns. Report-only (exit-code 0 /
    # continue-on-error) — a visibility baseline. Secret scanning is gated
    # separately in the `secret-scan` job above.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Trivy filesystem scan
        # Pinned to a full commit SHA (supply-chain: don't track a mutable tag).
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          scan-type: fs
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          exit-code: "0"
          ignore-unfixed: true
      - name: Semgrep scan
        continue-on-error: true
        run: |
          pip install semgrep==1.170.0
          semgrep --config p/python --config p/typescript --config p/secrets \
            --error --severity ERROR services/

  subscription-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: forbid API-key auth
        # docs/ may quote the forbidden strings when describing this guard;
        # the constraint binds code and config, so docs are excluded.
        run: |
          ! grep -rn --exclude-dir=.git --exclude-dir=node_modules --exclude-dir=.venv --exclude-dir=dist --exclude-dir=docs --exclude=ci.yaml -e 'sk-ant-' -e 'ANTHROPIC_API_KEY' .
