name: CI

on:
  # Pushes to main run EVERYTHING (the `changes` job below only filters pull
  # requests), docs-only pushes included: main is where a skipped-test escape
  # gets caught. A feature branch is covered by its pull_request run.
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 7 * * *"   # nightly full run, a second backstop for filtered PRs
  workflow_dispatch:

# A newer push contains the preceding commit on the same branch. Avoid
# spending runner time on a stale run while the developer iterates. Never on
# main: a later push must not cancel the run that gates the earlier one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Least privilege: jobs only need to read the repo.
permissions:
  contents: read

jobs:
  # Decides which jobs a pull request needs. Pushes to main, the nightly run and
  # manual runs set every output true. Anything the filters below don't name
  # still reaches `backend` (it is "everything except web-only paths"), and a
  # change to CI itself runs everything. Secret and security scans always run.
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      backend: ${{ steps.out.outputs.backend }}
      web: ${{ steps.out.outputs.web }}
      facade: ${{ steps.out.outputs.facade }}
      runner: ${{ steps.out.outputs.runner }}
      codex_proxy: ${{ steps.out.outputs.codex_proxy }}
      apps: ${{ steps.out.outputs.apps }}
      tools: ${{ steps.out.outputs.tools }}
      chart: ${{ steps.out.outputs.chart }}
    steps:
      - uses: actions/checkout@v4
      # Two passes, because the quantifier applies to every filter in a step:
      # "some" = a file matching ANY pattern selects the job (the alternatives
      # below); "every" = a file must match ALL patterns, which is what
      # "everything except web-only paths" needs (`**` plus exclusions).
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: f
        with:
          predicate-quantifier: some
          filters: |
            global:
              - '.github/**'
              - '.pre-commit-config.yaml'
              - 'bin/ap-verify'
            web:
              - 'services/web/**'
              - 'packages/ui/**'
              - 'apps/*/frontend/**'
              - 'package.json'
              - 'package-lock.json'
            facade:
              - 'services/mcp-facade/**'
              - 'services/backend/**'
            runner:
              - 'services/runner/**'
              - 'services/backend/agentplatform/workbench.py'
            codex_proxy:
              - 'services/codex-proxy/**'
              - 'charts/**'
            apps:
              - 'apps/**'
            tools:
              - 'tools/**'
              - 'services/tool-executor/**'
              - 'charts/**'
            chart:
              - 'charts/**'
              - 'services/claude-proxy/**'
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: g
        with:
          predicate-quantifier: every
          filters: |
            backend:
              - '**'
              - '!services/web/**'
              - '!packages/ui/**'
              - '!apps/*/frontend/**'
              - '!package.json'
              - '!package-lock.json'
      - name: Combine with the run-everything cases
        id: out
        env:
          FULL: ${{ github.event_name != 'pull_request' || steps.f.outputs.global == 'true' }}
          F: ${{ toJSON(steps.f.outputs) }}
          G: ${{ toJSON(steps.g.outputs) }}
        run: |
          for k in backend web facade runner codex_proxy apps tools chart; do
            v=$(echo "$F $G" | jq -rs --arg k "$k" 'map(.[$k] // empty) | first // "false"')
            if [ "$FULL" = "true" ] || [ "$v" = "true" ]; then echo "$k=true" >> "$GITHUB_OUTPUT"; else echo "$k=false" >> "$GITHUB_OUTPUT"; fi
          done

  backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # "extras" is a third parallel job for the small suites that ride along with
        # the backend (broker, discord, SDK drift), so neither test shard carries them.
        shard: [1, 2, extras]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/backend/pyproject.toml
      - name: Install backend
        run: pip install -e 'services/backend[dev]'
      - name: Run backend tests (shard ${{ matrix.shard }} of 2)
        if: matrix.shard != 'extras'
        # Includes the end-to-end SDK exercise (tests/test_sdk_integration.py):
        # the generated client drives the real ASGI app over httpx with a
        # genuine ap_ key — auth, RBAC, typed responses for real — and the
        # platform skill's documented /api paths are held to the live OpenAPI.
        # Shards are balanced by recorded durations (.test_durations; refresh with
        # `pytest -n auto --store-durations` when the suite changes a lot — stale
        # data only unbalances the shards, it never drops a test).
        run: pytest -n auto --splits 2 --group ${{ matrix.shard }} --durations-path .test_durations services/backend/tests
      - name: Broker tool tests
        if: matrix.shard == 'extras'
        # The broker's own tools (services/mcp-broker): the modules that reach
        # the API with the caller's token. They stub fastmcp rather than
        # installing an MCP runtime, so they ride along with the backend job.
        run: pytest services/mcp-broker
      - name: Discord connector tests
        if: matrix.shard == 'extras'
        # The bridge (services/connector-discord): it stubs discord.py and
        # aiokafka rather than installing a gateway client, so like the broker's
        # tests it rides along with the backend job.
        run: pytest services/connector-discord
      - name: SDK is in sync with the API
        if: matrix.shard == 'extras'
        # The SDK is generated from the OpenAPI spec; regenerate and fail if the
        # committed output differs, so it can never drift. Generator is pinned.
        run: |
          python sdk/regenerate.py
          git diff --exit-code sdk/ \
            || (echo "::error::sdk/ is stale — run 'python sdk/regenerate.py' and commit" && exit 1)

  # The runner is the in-pod process every agent run executes in (services/runner):
  # it renders the agent's markdown, drives Claude Code or Codex, and runs a dev
  # run's Workbench steps. This job runs its unit tests only; it builds no image.
  runner:
    # No build job for services/runner/Dockerfile.dev (several GB — CI runners cannot afford it); tests/test_runner_dev_image.py is its drift guard.
    needs: changes
    if: needs.changes.outputs.runner == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install runner deps
        run: pip install aiokafka pytest pytest-asyncio
      - name: Run runner tests
        run: cd services/runner && python -m pytest -q

  codex-proxy:
    needs: changes
    if: needs.changes.outputs.codex_proxy == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e 'services/codex-proxy[test]'
      - run: pytest -q services/codex-proxy/tests
      - run: docker build -t agent-platform-codex-proxy:test services/codex-proxy

  mcp-facade:
    # The external MCP facade (docs/design/17) generates its tools from the
    # API's own OpenAPI document, so its tests need BOTH the backend (to build
    # the real spec) and fastmcp. Same spec the SDK drift check uses: an API
    # change that would newly expose an excluded endpoint fails here.
    needs: changes
    if: needs.changes.outputs.facade == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend + facade deps
        run: pip install -q -e services/backend -r services/mcp-facade/requirements.txt pytest pytest-asyncio
      - name: Facade tests
        run: cd services/mcp-facade && python -m pytest -q

  apps:
    # Remaining coded App backends; News now runs in the platform backend.
    needs: changes
    if: needs.changes.outputs.apps == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: stockmarket app backend tests
        run: |
          pip install -q -r apps/stockmarket/backend/requirements.txt aiosqlite pytest pytest-asyncio
          cd apps/stockmarket/backend && python -m pytest -q
      - name: tcms app backend tests
        run: |
          pip install -q -r apps/tcms/backend/requirements.txt aiosqlite pytest pytest-asyncio
          cd apps/tcms/backend && python -m pytest -q
      - name: judgment app backend tests
        run: |
          pip install -q -r apps/judgment/backend/requirements.txt aiosqlite pytest pytest-asyncio
          cd apps/judgment/backend && python -m pytest -q

  tools:
    # Custom platform tools (docs/design/12): executor invariants + every
    # tool's own tests, run against the union of tool requirements exactly as
    # the executor image bakes them.
    needs: changes
    if: needs.changes.outputs.tools == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # The views pool's chart tests render the chart (they skip without helm).
      - uses: azure/setup-helm@v4
      - name: Update chart dependencies
        run: helm dependency update charts/agent-platform
      - name: Executor tests
        run: |
          pip install -q -r services/tool-executor/requirements.txt pytest
          cd services/tool-executor && python -m pytest -q
      - name: Tool requirements install cleanly (the image bake)
        run: |
          find tools -name requirements.txt -exec pip install -q -r {} \;
      - name: Per-tool tests
        # Every test file in the tool's directory, not only test_run.py: a tool
        # may ship a package beside run.py with its own tests (tools/backtest).
        run: |
          shopt -s nullglob
          for d in tools/*/; do
            tests=("$d"test_*.py)
            [ ${#tests[@]} -gt 0 ] || continue
            echo "== $d"; (cd "$d" && python -m pytest -q)
          done

  web:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install workspaces and build web
        # npm workspaces: the root install links @ap/ui (packages/ui) into
        # services/web and any apps/*/frontend.
        run: npm ci && cd services/web && npm run build
      - name: Build app frontends
        run: |
          npm run build -w stockmarket-frontend
          npm run build -w tcms-frontend
          npm run build -w judgment-frontend
      - name: Design-system token gate
        # No raw hex outside packages/ui/src/tokens.css — see packages/ui/README.md
        run: cd services/web && npm run check:tokens
      - name: Storybook builds
        run: cd services/web && npm run build:storybook

  # The Playwright UI gate is ~145s of the old single web job, so it runs as its own
  # three shards (Playwright's native --shard, fullyParallel is already on).
  web-ui:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install workspaces and build web
        run: npm ci && cd services/web && npm run build
      - name: Cache Playwright browser
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Install Playwright browser
        # The cache holds the browser download only; the OS packages always install.
        run: |
          cd services/web
          if [ "${{ steps.pw-cache.outputs.cache-hit }}" = "true" ]; then
            npx playwright install-deps chromium
          else
            npx playwright install --with-deps chromium
          fi
      - name: UI gate — smoke + axe over every page (mocked API), shard ${{ matrix.shard }}/3
        # The UI's backpressure: each page must render the production build
        # with zero console errors, zero unfixtured API calls, and no
        # serious/critical axe violations. See services/web/tests/.
        run: cd services/web && npx playwright test --shard=${{ matrix.shard }}/3

  helm:
    needs: changes
    if: needs.changes.outputs.chart == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - name: Update chart dependencies
        # OCI deps (bitnamicharts) are handled natively by helm 3.8+; no login needed.
        run: helm dependency update charts/agent-platform
      - name: Lint chart
        # Both secrets are `required` in the templates, so a lint needs both.
        run: helm lint charts/agent-platform --set env.AP_SESSION_SECRET=x --set env.AP_INTERNAL_SECRET=y

  claude-proxy:
    # The proxy has no source of its own — it is nginx, njs and the chart's
    # ConfigMap — so its tests render the chart and run the real image over the
    # render. Runners have Docker, so the integration tests run for real here.
    needs: changes
    if: needs.changes.outputs.chart == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: azure/setup-helm@v4
      - name: Update chart dependencies
        run: helm dependency update charts/agent-platform
      - name: Install test deps
        run: pip install pytest pyyaml
      - name: Run claude-proxy tests
        run: cd services/claude-proxy && python -m pytest -q

  secret-scan:
    # GATING backstop for the local pre-commit hooks (.pre-commit-config.yaml):
    # blocks a merge if a secret or a never-commit file slips in without the
    # hooks installed. Prevention still lives client-side (a public push exposes
    # a secret immediately); this catches it on PRs and fails loudly otherwise.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0                       # gitleaks scans full history
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run the same secret hooks as local pre-commit
        # Reuses .pre-commit-config.yaml verbatim (forbid-secret-files +
        # detect-private-key + gitleaks) so CI and dev machines check the exact
        # same things. Fails the build on any finding.
        run: |
          pip install pre-commit
          pre-commit run --all-files --show-diff-on-failure

  security-scan:
    # Supply-chain hardening (M06): scan the repo for vulnerable deps, IaC
    # misconfig, and risky code patterns. Report-only (exit-code 0 /
    # continue-on-error) — a visibility baseline. Secret scanning is gated
    # separately in the `secret-scan` job above.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Trivy filesystem scan
        # Pinned to a full commit SHA (supply-chain: don't track a mutable tag).
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          scan-type: fs
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          exit-code: "0"
          ignore-unfixed: true
      - name: Semgrep scan
        continue-on-error: true
        run: |
          pip install semgrep==1.170.0
          semgrep --config p/python --config p/typescript --config p/secrets \
            --error --severity ERROR services/

  subscription-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: forbid API-key auth
        # Scan tracked code/config, not generated bytecode or a developer's
        # ignored scratch files. Documentation may describe the guard.
        run: |
          ! git grep -n -I -e 'sk-ant-' -e 'ANTHROPIC_API_KEY' -- . ':!docs/**' ':!.github/workflows/ci.yaml'

  # The one check to require once branch protection is on. Skipped jobs are fine
  # (the `changes` job chose not to run them); a failed or cancelled one is not.
  ci-ok:
    needs: [changes, backend, runner, codex-proxy, mcp-facade, apps, tools, web, web-ui, helm, claude-proxy, secret-scan, security-scan, subscription-guard]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Fail on any failed or cancelled job
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: |
          echo "$RESULTS"
          if echo "$RESULTS" | grep -qE '"(failure|cancelled)"'; then exit 1; fi
