server {
  listen 8080;
  root /usr/share/nginx/html;
  # Encrypted recovery files can exceed the ordinary artifact upload limit.
  # The API independently caps imports at 512 MiB and never stores the key.
  location = /api/backups/import/inspect {
    client_max_body_size 513m;
    proxy_pass http://agent-platform-api:8000;
    proxy_read_timeout 420s;
    proxy_send_timeout 420s;
  }
  location /api/ {
    proxy_pass http://agent-platform-api:8000;
    proxy_http_version 1.1;
    # Artifact uploads (docs/design/23): the API caps an artifact at 8 MiB and
    # a multipart body carries some framing around it; nginx's 1 MiB default
    # would 413 every upload before the API ever saw it.
    client_max_body_size 16m;
    # Image generation (POST /api/artifacts/generate, design/23) is synchronous
    # and blocks up to the backend's CODEX_IMAGE_TIMEOUT_SECONDS (390s), saving
    # the artifact before it responds. nginx's default 60s proxy_read_timeout
    # would 504 that request even though the generation succeeded, so the caller
    # sees a timeout despite a saved artifact and may retry a paid generation
    # (ENG-6). Allow the full backend window plus grace; ordinary /api/ calls
    # still return in milliseconds.
    proxy_read_timeout 420s;
    proxy_send_timeout 420s;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
  }
  # Bare /api: answer as the API (a JSON 404), not a trailing-slash 301 that
  # would leak nginx's internal :8080 into the redirect Location.
  location = /api { return 404; }

  # The external MCP facade (docs/design/17): the platform API as MCP tools for
  # clients outside the cluster. The caller's Authorization header rides through
  # (nginx forwards it by default) — the facade holds no credential of its own —
  # and the browser session Cookie is stripped, exactly as the /apps/ route
  # below does: this door authenticates by API key only, and the platform API
  # tries a session cookie BEFORE a bearer. The facade strips it again on the
  # upstream hop; this is the outer of the two belts.
  # Streamable HTTP answers with long-lived SSE-shaped responses, so buffering
  # is off in both directions and the read timeout is generous; `Connection ""`
  # keeps this off the websocket upgrade path /api/ uses.
  # Exact + subtree only, so an unrelated /mcpfoo route can never land here.
  location = /mcp {
    proxy_pass http://agent-platform-mcp-facade:8000;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Cookie "";
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_cache off;
    proxy_read_timeout 1h;
    proxy_send_timeout 1h;
  }
  location /mcp/ {
    proxy_pass http://agent-platform-mcp-facade:8000;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Cookie "";
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_cache off;
    proxy_read_timeout 1h;
    proxy_send_timeout 1h;
  }
  # The design-system workshop (static Storybook build) — directory indexes,
  # never the SPA fallback.
  location /storybook/ { try_files $uri $uri/ =404; }

  # App routes (docs/design/11): /apps/<name>/ proxies to that app's Service,
  # session-guarded by auth_request against the platform API. The app never
  # sees credentials — it receives trusted X-AP-User / X-AP-Role / X-AP-Auth
  # headers. All three are always set here, so a client can't supply its own.
  location = /internal/auth-check {
    internal;
    proxy_pass http://agent-platform-api:8000/api/auth-check;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header X-Original-URI $request_uri;
  }
  # State Apps (docs/design/39) are pages of this SPA, not a coded App's
  # Service. `^~` stops the regex below from claiming /apps/state/ as an App
  # named "state", so a reload or a shared link lands on the SPA.
  location ^~ /apps/state/ { try_files $uri /index.html; }
  # Preserve bookmarks from the retired coded News app. Topic slugs no longer
  # identify state records, so the old topic route opens a matching search.
  location = /apps/news { return 302 /apps/state/news/pages/home$is_args$args; }
  location = /apps/news/ { return 302 /apps/state/news/pages/home$is_args$args; }
  location ~ "^/apps/news/day/(?<news_day>[0-9]{4}-[0-9]{2}-[0-9]{2})/?$" {
    return 302 /apps/state/news/pages/day?day=$news_day;
  }
  location ~ "^/apps/news/topic/(?<news_topic>[a-z0-9-]+)/?$" {
    return 302 /apps/state/news/pages/home?q=$news_topic;
  }
  location ~ ^/apps/(?<appname>[a-z][a-z0-9-]*)(/|$) {
    auth_request /internal/auth-check;
    auth_request_set $ap_user $upstream_http_x_ap_user;
    auth_request_set $ap_role $upstream_http_x_ap_role;
    auth_request_set $ap_auth $upstream_http_x_ap_auth;
    # Variable proxy_pass → nginx resolves the Service name at request time;
    # 10.43.0.10 is k3s's stable CoreDNS ClusterIP (judgment call: baked here
    # rather than templating nginx.conf into a ConfigMap for one value).
    resolver 10.43.0.10 valid=30s;
    set $app_upstream http://agent-platform-app-$appname.agent-platform.svc.cluster.local:8000;
    proxy_pass $app_upstream$request_uri;
    proxy_http_version 1.1;
    proxy_set_header X-AP-User $ap_user;
    proxy_set_header X-AP-Role $ap_role;
    proxy_set_header X-AP-Auth $ap_auth;
    proxy_set_header Authorization "";
    proxy_set_header Cookie "";
  }
  location / {
    # SPA fallback. A request whose RAW URI targets /api reaches here only when
    # encoded-slash / `..` normalization escaped the /api/ location above (e.g.
    # `/api/..%2f` normalizes to `/`). Answer those with a clean 404 rather than
    # the SPA shell — `$request_uri` is the pre-normalization URI, so this sees
    # the client's real target. Genuine SPA routes never start with /api.
    if ($request_uri ~ ^/api(/|$|\?)) { return 404; }
    try_files $uri /index.html;
  }
}
