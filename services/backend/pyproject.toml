[project]
name = "agentplatform"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115", "uvicorn[standard]>=0.30", "sqlalchemy[asyncio]>=2.0",
  "asyncpg>=0.29", "aiosqlite>=0.20", "aiokafka>=0.11", "kubernetes>=30.1",
  "pydantic-settings>=2.4", "argon2-cffi>=23.1", "itsdangerous>=2.2",
  "pyyaml>=6.0", "websockets>=12.0", "pyjwt[crypto]>=2.9", "croniter>=3.0",
  "nh3>=0.2.18", "httpx>=0.27",
  # Artifacts (docs/design/23): Pillow is the only code that ever decodes an
  # upload, and only for the four rasters; python-multipart is FastAPI's
  # multipart parser for the upload route.
  "pillow>=10.4", "python-multipart>=0.0.9",
]
[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "httpx>=0.27",
       # bin/ap-verify adds --cov and --junitxml to the backend suite when
       # pytest_cov imports, and --timeout=120 so one hung test cannot eat
       # the whole per-suite budget.
       "pytest-cov>=5", "pytest-timeout>=2.3",
       # SDK generation + the generated client's runtime deps, so CI can
       # regenerate sdk/ and import it (see sdk/regenerate.py). The generator is
       # PINNED: its output must be byte-stable for the CI drift check.
       "openapi-python-client==0.29.0", "attrs>=22.2", "python-dateutil>=2.8"]
[tool.pytest.ini_options]
asyncio_mode = "auto"
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[tool.setuptools.packages.find]
include = ["agentplatform*"]
[tool.setuptools.package-data]
agentplatform = ["live_operation_catalog.json"]
