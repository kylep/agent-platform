name: memory
category: platform_capability
description: >-
  Your persistent memory across runs — reading and writing are one tool
  because your namespace is private (you can never see another agent's
  memories). Default action="read" searches your namespace: q is split into terms
  and a memory matches when every term appears in its content or key; empty
  q lists the newest. action="save" stores content; pass key ONLY for state
  you overwrite in place (reusing a key replaces that memory) — omit it for
  plain notes, don't invent meaningless keys. Optional tags on save. Explicit
  mode="hybrid" ranks meaningful query terms and semantic matches, returning
  bounded matching excerpts with source_hash, truncated and excerpt offsets
  (Unicode codepoints). Sources can report evidence omitted for insufficient
  remaining budget. retrieval.relevance is unassessed: similarity and valid
  provenance do not prove a note answers the question. State uncertainty or no
  relevant evidence when returned notes do not support an answer.
params:
  type: object
  properties:
    action:
      type: string
      enum: [read, save]
    mode: {type: string, enum: [lexical, hybrid], default: lexical, description: "read: hybrid returns ranked excerpts, source_hash, truncated, excerpt offsets and retrieval status; lexical retains term-AND behavior"}
    q:
      type: string
      description: "read: default lexical search terms all must match and empty lists newest; hybrid accepts a natural-language question or full key"
    content:
      type: string
      description: "save: the memory text"
    key:
      type: string
      description: "save: stable label for overwrite-in-place state only"
    tags:
      type: array
      items: {type: string}
    limit: {type: integer, default: 50}
    current_team: {type: boolean, description: "read only memories tagged to this run's team"}
    current_project: {type: boolean, description: "read only memories tagged to this run's project"}
  required: [action]
infra:
  database: true
timeout_seconds: 20
