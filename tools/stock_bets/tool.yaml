name: stock_bets
category: domain_capability
description: >-
  The stock-bets App: one paper bet per US trading day, scored by the App
  from real daily bars. Paper only, no money, no advice. You never supply a
  price, a time or a result: the App stamps the clock, fetches the bars and
  does every calculation. Actions:
  bet (the pet only): today's bet — symbol (one of SPY QQQ IWM DIA XLK XLF
  XLE XLV XLY XLI XLU XLP SMH TLT GLD USO AAPL MSFT NVDA AMZN GOOGL META TSLA
  AVGO AMD), side long|short, exit {kind: open|close} or {kind: bracket,
  target_pct?, stop_pct?} (0.2 to 5 each), confidence 0.50-0.90, basis
  catalyst|momentum|reversal|macro|default, thesis (2 sentences), sources
  (1-3 URLs). Entry is today's official close; the exit is the next
  session. A second bet for a session is refused; a bet after the close is
  marked late; on a holiday it answers status=closed (not an error).
  settle: scores every open bet whose exit session has closed (+20 min), and
  lists bets still waiting. Safe to call any time; never double-scores.
  lesson (the pet only): one sentence on a scored bet (session=YYYY-MM-DD),
  written once.
  history: the last `limit` bets (default 10) with results and lessons.
  scoreboard: win rate, direction hits, average net %, P&L, always-long-SPY
  and random-pick (field) baselines, overall / last 20 / blocks of 20 / by
  playbook / by basis / by side.
  check: re-scores a settled bet (session, default newest) from fresh bars
  and lists differences, writing nothing.
  playbook (olu only): record a new PLAYBOOK version with text, reason,
  prediction, refuter; bets record the version in force.
  research (olu only): a research note — source, claim, status READ|TESTED,
  idea.
  import (olu only): wiki-ledger bets [{made (ISO time with offset), symbol,
  side, exit, confidence, basis, thesis, sources, playbook, pet_net_pct?}];
  settle then scores them and flags where the pet's own arithmetic differed.
params:
  type: object
  properties:
    action:
      type: string
      enum: [bet, settle, lesson, history, scoreboard, check, playbook, research, import]
    symbol: {type: string, maxLength: 8}
    side: {type: string, enum: [long, short]}
    exit:
      type: object
      properties:
        kind: {type: string, enum: [open, close, bracket]}
        target_pct: {type: number}
        stop_pct: {type: number}
      required: [kind]
      additionalProperties: false
    confidence: {type: number}
    basis: {type: string, enum: [catalyst, momentum, reversal, macro, default]}
    thesis: {type: string, maxLength: 600}
    sources:
      type: array
      maxItems: 10
      items: {type: string, maxLength: 300}
    session:
      type: string
      pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}$'
    lesson: {type: string, maxLength: 500}
    limit: {type: integer, minimum: 1, maximum: 60}
    version: {type: string, maxLength: 16}
    text: {type: string, maxLength: 16000}
    reason: {type: string, maxLength: 4000}
    prediction: {type: string, maxLength: 4000}
    refuter: {type: string, maxLength: 4000}
    source: {type: string, maxLength: 1000}
    claim: {type: string, maxLength: 4000}
    status: {type: string, enum: [READ, TESTED]}
    idea: {type: string, maxLength: 4000}
    bets:
      type: array
      maxItems: 60
      items: {type: object}
  required: [action]
  additionalProperties: false
app_access:
  roles: [bets, playbook, research]
  verbs: [read, create, update]
timeout_seconds: 120
