name: discord_chat
category: service_connector
description: >-
  Post to a Discord text channel by unique name or exact channel ID. A name
  shared by multiple visible servers is rejected; use channel_id then. Long
  messages are split into <=1900-character chunks;
  @everyone/@here and role pings are always defanged. Use for notifications
  and reports; conversational replies in threads happen via the platform
  connector, not this tool. Returns the posted message id(s).
params:
  type: object
  properties:
    channel:
      type: string
      description: "Unique channel name without the # (e.g. alerts)"
    channel_id:
      type: string
      pattern: "^[0-9]{15,22}$"
      description: "Exact Discord channel ID when a name is ambiguous"
    text:
      type: string
      description: "Message text (Discord markdown ok)"
  required: [text]
  oneOf:
    - required: [channel]
      not: {required: [channel_id]}
    - required: [channel_id]
      not: {required: [channel]}
infra:
  secrets:
    - discord-bot
timeout_seconds: 30
