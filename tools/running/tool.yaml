name: running
category: domain_capability
description: >-
  Deterministic views, coaching context and a weekly brief over the Running
  App. The brief action writes one completed-week note and its report, only
  after Strava sync is fresh; report retries an unfinished report safely.
params:
  type: object
  properties:
    action:
      type: string
      enum: [dashboard, calendar, weekly, coach_context, brief, report, recover_reports]
    week_start:
      type: string
      pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}$'
    body: {type: string, maxLength: 2000}
    highlights:
      type: array
      maxItems: 6
      items: {type: string, maxLength: 200}
    tags:
      type: array
      maxItems: 4
      items: {type: string, maxLength: 64}
  required: [action]
  additionalProperties: false
app_access:
  roles: [activities, briefs, sync]
  verbs: [read, create, update]
view_actions:
  dashboard:
    sources: [activities]
    params: {type: object, properties: {}, additionalProperties: false}
    output_schema:
      type: object
      properties:
        rows:
          type: array
          maxItems: 1
          items:
            type: object
            properties:
              total_km: {type: number, minimum: 0}
              activities: {type: integer, minimum: 0}
              runs: {type: integer, minimum: 0}
              total_elevation_m: {type: integer, minimum: 0}
              longest_run_km: {type: number, minimum: 0}
              fastest_5k: {type: string, maxLength: 32}
              fastest_10k: {type: string, maxLength: 32}
              longest_streak: {type: integer, minimum: 0}
              current_streak: {type: integer, minimum: 0}
            required: [total_km, activities, runs, total_elevation_m,
                       longest_run_km, fastest_5k, fastest_10k,
                       longest_streak, current_streak]
            additionalProperties: false
      required: [rows]
      additionalProperties: false
    max_rows: 1
    max_bytes: 4096
  calendar:
    sources: [activities]
    params: {type: object, properties: {}, additionalProperties: false}
    output_schema:
      type: object
      properties:
        rows:
          type: array
          maxItems: 190
          items:
            type: object
            properties:
              day: {type: string, pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}$'}
              distance_km: {type: number, minimum: 0}
              count: {type: integer, minimum: 0}
            required: [day, distance_km, count]
            additionalProperties: false
      required: [rows]
      additionalProperties: false
    max_rows: 190
    max_bytes: 24576
  weekly:
    sources: [activities]
    params: {type: object, properties: {}, additionalProperties: false}
    output_schema:
      type: object
      properties:
        rows:
          type: array
          maxItems: 12
          items:
            type: object
            properties:
              week_start: {type: string, pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}$'}
              distance_km: {type: number, minimum: 0}
              runs: {type: integer, minimum: 0}
              moving_time_s: {type: integer, minimum: 0}
            required: [week_start, distance_km, runs, moving_time_s]
            additionalProperties: false
      required: [rows]
      additionalProperties: false
    max_rows: 12
    max_bytes: 4096
timeout_seconds: 120
