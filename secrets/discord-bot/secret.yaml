# The Discord bot token the connector-discord deployment logs in with
# (secretKeyRef on key `token`). The probe's "Bot {token}" template tolerates a
# pasted "Bot " prefix — interpolation drops the duplicate scheme. Discord's
# API sits behind Cloudflare, which 403s requests without a real User-Agent.
name: discord-bot
description: Discord bot token — how the Discord connector authenticates.
keys:
  - name: token
    hint: "Discord bot token — Developer Portal → your app → Bot → Reset/Copy Token."
verify:
  probe:
    url: https://discord.com/api/v10/users/@me
    headers:
      Authorization: "Bot {token}"
      User-Agent: "DiscordBot (https://github.com/kylep/agent-platform, 1.0)"
