# Strava API v3 credentials for the read-only `strava` tool (and the Running
# app that pulls Kyle's activities through it). Four values: the app's client
# id + secret, and a seed user access/refresh token pair.
#
# Mint the tokens with the strava skill's `auth` flow (claude-plugins
# pai-tools/strava): it prints an authorize URL, and `auth --code <code>`
# exchanges the redirect code for the access + refresh tokens to paste here.
# Scope needed: read,activity:read_all,profile:read_all.
#
# The access token lives ~6h and Strava ROTATES the refresh token on every
# refresh (old one dies immediately). The tool caches the rotating tokens in
# its own pg schema and refreshes on use, so these four values are only the
# SEED — after the tool's first refresh, its DB cache is the source of truth
# and this refresh token is spent. That is why verification (verify_strava.py)
# never refreshes: it would burn the seed. It only confirms the keys are
# present and, when still fresh, that the access token authenticates.
name: strava
description: Strava API v3 client credentials + a seed user token pair (read-only running/activity data).
keys:
  - name: STRAVA_CLIENT_ID
    hint: "Strava API application Client ID — strava.com/settings/api (not secret)."
  - name: STRAVA_CLIENT_SECRET
    hint: "Strava API application Client Secret — strava.com/settings/api."
  - name: STRAVA_ACCESS_TOKEN
    hint: "Seed access token from the strava skill's `auth --code` exchange (scope read,activity:read_all,profile:read_all)."
  - name: STRAVA_REFRESH_TOKEN
    hint: "Seed refresh token from the same exchange. Rotates on first use — the tool takes over caching after that."
verify:
  script: verify_strava.py
