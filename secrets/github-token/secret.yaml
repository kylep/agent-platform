# The token the `git` skill pushes with. Bound to agent pods via envFrom, so
# the key name IS the env var the skill reads.
name: github-token
description: GitHub token/PAT the git skill uses to clone and push over HTTPS.
keys:
  - name: GITHUB_TOKEN
    hint: "GitHub token/PAT with repo scope — skills read it as $GITHUB_TOKEN."
verify:
  probe:
    url: https://api.github.com/user
    headers:
      Authorization: "Bearer {GITHUB_TOKEN}"
      User-Agent: agent-platform
