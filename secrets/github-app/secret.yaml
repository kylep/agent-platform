# GitHub App credentials (PericakAI) — how the platform pushes branches and
# opens PRs for self-edit. Multi-key, so it's set via the API (bin/ helper or
# a JSON PUT), not the single-value UI editor. Verification needs RS256 JWT
# signing, which a declarative probe can't express — hence the script.
name: github-app
description: GitHub App creds (app_id, install_id, private_key) so the platform can open PRs.
hint: "GitHub App creds (app_id, install_id, private_key) — a multi-key secret, set via the API."
keys:
  - name: app_id
    hint: "App ID — github.com/settings/apps → your app"
  - name: install_id
    hint: "Installation ID (from the installation page URL)"
  - name: private_key
    hint: "The app private key .pem contents (multi-line PEM)"
verify:
  script: verify_github_app.py
