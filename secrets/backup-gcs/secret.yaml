name: backup-gcs
description: Google Cloud Storage destination for encrypted Agent Platform recovery archives.
required: false
hint: Configure under Settings → Connections → Cloud backups. This credential is held by the backup Job, never an agent run.
keys:
  - name: bucket
    hint: Private bucket name, without gs://.
  - name: prefix
    hint: Object prefix, such as agent-platform.
  - name: age_recipient
    hint: Public age recipient. Never paste the private recovery key here.
  - name: service_account_json
    hint: JSON key for a service account with Storage Object Creator on this bucket only.
