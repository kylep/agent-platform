name: figma-token
description: >-
  Figma personal access token for internal UI Designer imports. Grant only
  file_content:read. The token is bound only to the executor fetch tool.
  It remains unverified until an import reads the selected file through that
  tool; no backend probe receives this credential, and /v1/me is not used
  because it requires an additional current_user:read scope.
keys:
  - name: FIGMA_TOKEN
    hint: "Figma Settings → Security → Personal access tokens; file_content:read only."
verify:
  run: true
