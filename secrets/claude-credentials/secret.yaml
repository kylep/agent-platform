# The Claude subscription token every agent run authenticates with. The value
# lives only in the claude-proxy pod's mounted k8s Secret (docs/design/09);
# runner pods get a placeholder. No probe: this secret is verified BY RUN — a
# run can't reach `succeeded` without authenticating, and the recorder marks
# the status valid/invalid from run outcomes.
name: claude-credentials
description: Claude subscription OAuth token runs authenticate with (held by claude-proxy).
required: true
hint: "A `claude setup-token` value, or paste credentials.json contents (JSON is auto-detected)."
verify:
  run: true
