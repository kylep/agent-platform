# OpenAI API key the `image_gen` tool uses for the gpt-image models. Optional:
# without it the tool reports the OpenAI provider as not configured and the
# other providers keep working. Only the tool-executor subprocess ever holds
# the value — the API and the model see artifacts, not provider traffic.
name: openai-api-key
description: OpenAI API key the image_gen tool uses to generate images with the gpt-image models.
keys:
  - name: OPENAI_API_KEY
    hint: "OpenAI API key — platform.openai.com → API keys → Create new secret key."
verify:
  probe:
    url: https://api.openai.com/v1/models
    headers:
      Authorization: "Bearer {OPENAI_API_KEY}"
      User-Agent: agent-platform
