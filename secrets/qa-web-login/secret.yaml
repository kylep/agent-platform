# The `qa` principal's console login (docs/design/25). Nobody sets this one:
# the API mints the password once at boot (`ensure_qa_principal`, gated on the
# `qa-principal-v1` schema mark), stores it here and never shows it. The QA
# agent's row binds this block, so its pod gets the two values as env and
# `bin/ap-web-login` turns them into a Playwright storage state — the model
# never handles the password. The row is a `reader`: it renders every page and
# is refused by every write route.
#
# THIS STORED SECRET IS THE SOURCE OF TRUTH, not the `qa` row: the QA pod can
# read its password from nowhere else, so a row whose password is not in here
# is rotated at boot (new hash, new value, a WARNING in the API log).
#
# To rotate: delete the value (Secrets page, or `kubectl delete secret
# qa-web-login`) AND clear the mark (`DELETE FROM schema_marks WHERE name =
# 'qa-principal-v1'`), then restart the API. Deleting the value alone leaves a
# password nobody knows until the mark is cleared; clearing the mark alone
# adopts the row and leaves the stored value as it is.
name: qa-web-login
description: The `qa` principal's console password — minted by the platform at boot; delete the value and clear the `qa-principal-v1` mark to rotate.
hint: "Minted by the platform at boot; this stored value is the source of truth (a `qa` row whose password is not here is rotated at boot). Delete the value and clear the `qa-principal-v1` mark to rotate."
required: false
keys:
  - name: QA_WEB_USER
    hint: "The principal name the QA's browser logs in as (always `qa`)."
  - name: QA_WEB_PASSWORD
    hint: "Minted by the platform at boot; delete the value and clear the `qa-principal-v1` mark to rotate."
verify:
  script: verify_qa_login.py
