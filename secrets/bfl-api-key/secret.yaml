# Black Forest Labs key the `image_gen` tool uses for the FLUX models.
# Optional: without it the FLUX provider reports itself as not configured.
# BFL has no free read-only "whoami" endpoint, so a 2xx probe can't express
# the check — verify_bfl.py polls a nonexistent task id and reads the status
# code: an auth rejection is the only failure.
name: bfl-api-key
description: Black Forest Labs API key the image_gen tool uses to generate images with the FLUX models.
keys:
  - name: BFL_API_KEY
    hint: "Black Forest Labs API key — dashboard.bfl.ai → API keys → Create key."
verify:
  script: verify_bfl.py
