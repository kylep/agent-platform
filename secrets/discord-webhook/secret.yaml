# The incoming-webhook URL the `discord` skill posts with. The URL itself is
# the credential — GETting it returns the webhook object when valid. Bound via
# envFrom, so the key name is the env var the skill reads.
name: discord-webhook
description: Discord incoming webhook URL the discord skill posts messages to.
keys:
  - name: DISCORD_WEBHOOK_URL
    hint: "Discord incoming webhook URL, e.g. https://discord.com/api/webhooks/…"
verify:
  probe:
    url: "{DISCORD_WEBHOOK_URL}"
    headers:
      User-Agent: "DiscordBot (https://github.com/kylep/agent-platform, 1.0)"
