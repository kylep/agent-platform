# Google AI Studio key the `image_gen` tool uses for the Gemini image models.
# Optional: without it the Gemini provider reports itself as not configured.
# The key travels in the x-goog-api-key header, never `?key=` in the URL: a
# query-string key lands in access logs, and newer-format keys reject it.
name: gemini-api-key
description: Google Gemini API key the image_gen tool uses to generate images with the Gemini image models.
keys:
  - name: GEMINI_API_KEY
    hint: "Gemini API key — aistudio.google.com → Get API key → Create API key."
verify:
  probe:
    url: https://generativelanguage.googleapis.com/v1beta/models
    headers:
      x-goog-api-key: "{GEMINI_API_KEY}"
      User-Agent: agent-platform
