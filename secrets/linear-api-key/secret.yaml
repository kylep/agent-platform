# Personal API key the `linear` skill uses to call Linear's GraphQL API.
# Linear has no GET-based read-only endpoint (the API is GraphQL-only and
# every operation, including reads, is a POST), so the declarative probe
# can't apply — verification is a sandboxed script that asks the API for the
# key's own viewer.
name: linear-api-key
description: Linear personal API key the linear skill uses to read/write issues, projects, and comments.
keys:
  - name: LINEAR_API_KEY
    hint: "Linear personal API key — Linear → Settings → Account → Security & access → Personal API keys → New API key."
verify:
  script: verify_linear.py
