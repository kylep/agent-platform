# Personal API key the `linear` skill uses to call Linear's GraphQL API.
# Linear has no GET-based read-only endpoint to probe (the API is GraphQL-only
# and every operation, including reads, is a POST), so this secret has no
# declarative probe — the platform can only confirm a value is present, not
# that it's valid.
name: linear-api-key
description: Linear personal API key the linear skill uses to read/write issues, projects, and comments.
keys:
  - name: LINEAR_API_KEY
    hint: "Linear personal API key — Linear → Settings → Account → Security & access → Personal API keys → New API key."
