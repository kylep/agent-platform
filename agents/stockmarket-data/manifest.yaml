description: "Loads daily price bars into the stockmarket app's archive (backfills and the weekday sync). Deliberately has no web access — it only calls the prices tool."
role: operator
# Nothing here is a judgement call: pick symbols, call one tool, report the
# count. Haiku would do, but sonnet handles a partial-failure batch better.
model: sonnet
# A five-year backfill of several symbols is a few Yahoo round trips per
# symbol inside a 120s tool timeout; give the run room for a couple of those.
timeout_seconds: 600
# The privilege split that matters (mirrors the news agent's): THIS agent holds
# the only tool that can write to the app's database, and it never reads
# untrusted text — no WebSearch, no WebFetch, no skills, no memory. Its
# sibling `stockmarket` does the web reading and cannot write anything.
# Neither one alone can be talked into corrupting the archive.
