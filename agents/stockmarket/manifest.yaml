description: "Writes the weekday market brief on QQQ, SPY and XIU.TO — what moved, which holdings drove it, and why (the stockmarket app ingests, tags, and posts it)."
role: operator
# Curation and a few sentences of prose, once a weekday — the same call the
# news agent makes.
model: sonnet
# Three index_movers calls plus a handful of searches to source the "why".
timeout_seconds: 600
# Deliberately credential-less: NO memory, NO skills, NO bound secrets, and —
# critically — NO write access. It reads untrusted web pages to explain the
# session, so it holds nothing worth stealing and can damage nothing. Its JSON
# result goes to the app, which is trusted deterministic code, and the app
# does the storing, tagging and posting. Its sibling `stockmarket-data` owns
# the only database-writing tool and never touches the web.
result_topic: app.stockmarket.inbound
