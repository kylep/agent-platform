# Five minutes after the opening bell. The session it explains is the last
# COMPLETED one — at 9:35 today has barely started and Yahoo is ~15 minutes
# delayed, so the brief covers yesterday's close (Friday's, on a Monday) and
# lands as a morning read rather than an evening recap.
#
# Pinned to Toronto rather than UTC: "9:35 on a weekday" is 13:35 UTC in
# summer and 14:35 UTC in winter, and a market-open job on a UTC cron would
# quietly start firing an hour early every November.
cron: ["35 9 * * 1-5"]
timezone: America/Toronto
