description: System agent that watches platform health and pings Discord on threshold breaches.
role: operator
concurrency: 1
timeout_seconds: 300
schedule: "*/15 * * * *"
model: sonnet
system: true
# Remembers what it has already alerted on (dedup) across runs. Also injects the
# per-run AP_API_TOKEN the platform MCP server uses to broker its API access, so
# this agent needs no shell — it acts only through mcp__platform__* tools.
memory: true
