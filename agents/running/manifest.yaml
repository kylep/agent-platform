description: "Pulls Kyle's Strava activities through the read-only strava tool and writes a weekly coach's brief; the running app stores the activities, computes the stats, posts the recap and writes the report."
role: operator
# Curation plus a short encouraging narrative, once a day — the same shape of
# call the stockmarket and news agents make.
model: sonnet
# A query_app read, one or two strava tool calls, and a few sentences of prose.
timeout_seconds: 300
# Deliberately credential-less: NO memory, NO skills, NO bound secrets. Its
# only reach into the world is the read-only `strava` tool (which holds its own
# OAuth) and query_app (reader). It can fetch nothing else and write nothing
# directly — its JSON result goes to the running app over Kafka, and the app,
# trusted deterministic code, does the storing, tagging, posting and reporting.
result_topic: app.running.inbound
