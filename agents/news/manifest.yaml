description: "Gathers the day's notable news and emits a structured digest (the news app ingests, dedups, posts to #news, and writes the daily report)."
role: operator
# Sonnet is plenty for curation and cheap for a daily job.
model: sonnet
# Several web searches; give it room.
timeout_seconds: 600
# Deliberately credential-less: NO memory, NO skills, NO bound secrets. It only
# has WebSearch/WebFetch (agent.md frontmatter) and emits a JSON digest as its
# result. The recorder publishes that result here and the NEWS APP (trusted,
# deterministic code) does the rest: dedup, tagging, Discord post, daily
# report. This keeps the untrusted-input agent free of anything worth stealing.
result_topic: app.news.inbound
