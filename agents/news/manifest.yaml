description: Gathers the day's notable news and emits a structured digest (the platform posts it to #news).
role: operator
# Sonnet is plenty for curation and cheap for a daily job.
model: sonnet
# Several web searches; give it room.
timeout_seconds: 600
# Deliberately credential-less: NO memory, NO skills, NO bound secrets. It only
# has WebSearch/WebFetch (agent.md frontmatter) and emits a JSON digest as its
# result — the platform's news projector dedups/sanitizes and the connector
# posts. This keeps the untrusted-input agent free of anything worth stealing.
