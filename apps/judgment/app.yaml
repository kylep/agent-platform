# The Judgment app (docs/design/38): Kai's private beliefs, predictions and
# Kyle's feedback (schema app_judgment). The `judgment` tool is Kai's only
# way in and writes these tables directly; this app owns the DDL and serves
# Kyle's page at /apps/judgment/. The API answers only Kyle's admin session,
# so `query_app`, reader logins and API keys are refused. No Kafka and no
# agent key: nothing outside the app hears about a belief, and the app never
# calls the platform.
name: judgment
description: Kai's model of Kyle — beliefs with their version trail, predictions made before he decides, the feedback he shares, and an honest review.
icon: ⚖️
ui: true
api: true
needs:
  postgres: true
