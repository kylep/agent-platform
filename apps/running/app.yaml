# The running app: a Strava activity log, calendar heatmap, weekly mileage,
# PR board, fun totals, and a weekly coach's brief. Owns the activity archive
# (schema app_running). The `running-coach` agent calls the read-only Strava
# tool, which publishes normalized activities directly to app.running.inbound.
# The agent's weekly note reaches the same topic through the recorder. This app
# parses, stores, computes stats, posts the completed-week recap, and writes the
# report. Everything lives at
# /apps/running/. The app itself has NO third-party egress — it never holds
# Strava credentials.
name: running
display_name: Running Coach
description: A useful next step from your Strava history — training trends, recent efforts, and a weekly coach's brief.
icon: 🏃
ui: true
api: true
needs:
  postgres: true
  kafka_topics:
    - app.running.inbound          # the agent's activities + weekly brief (via the recorder)
    - app.running.brief.posted     # one event per posted weekly brief
agent_key:
  role: annotator                  # writes the weekly-running report; enqueues no runs (below operator)
