# The running app: a Strava activity log, calendar heatmap, weekly mileage,
# PR board, fun totals, and a weekly coach's brief. Owns the activity archive
# (schema app_running). Activities and the brief arrive over Kafka: the
# `running` agent pulls them through the read-only `strava` tool and its result
# is published to app.running.inbound; this app parses, stores, computes the
# stats, posts the weekly recap and writes the report. Everything lives at
# /apps/running/. The app itself has NO third-party egress — it never holds
# Strava credentials.
name: running
description: Your Strava runs — a calendar heatmap, weekly mileage, personal records, and a weekly coach's brief.
icon: 🏃
ui: true
api: true
needs:
  postgres: true
  kafka_topics:
    - app.running.inbound          # the agent's activities + weekly brief (via the recorder)
    - app.running.brief.posted     # one event per posted weekly brief
agent_key:
  role: annotator                  # writes the weekly-running report; enqueues no runs (below operator)
