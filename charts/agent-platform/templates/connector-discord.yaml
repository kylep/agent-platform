{{- if .Values.connectors.discord.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-connector-discord
  labels:
    {{- include "agent-platform.selectorLabels" (dict "Release" .Release "Chart" .Chart "component" "connector-discord") | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "agent-platform.selectorLabels" (dict "Release" .Release "Chart" .Chart "component" "connector-discord") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "agent-platform.selectorLabels" (dict "Release" .Release "Chart" .Chart "component" "connector-discord") | nindent 8 }}
    spec:
      # This pod never calls the k8s API — don't mount a ServiceAccount token.
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: connector-discord
          image: "{{ .Values.connectors.discord.image.repository }}:{{ .Values.connectors.discord.image.tag }}"
          imagePullPolicy: {{ .Values.connectors.discord.image.pullPolicy | default "IfNotPresent" }}
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 1001
            runAsGroup: 1001
            capabilities:
              drop: ["ALL"]
          env:
            - name: AP_KAFKA_BOOTSTRAP
              value: "{{ .Release.Name }}-kafka:9092"
            - name: CONNECTOR_AGENT
              value: {{ .Values.connectors.discord.agent | quote }}
            - name: DISCORD_BOT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: discord-bot
                  key: token
            # The api Service is hardcoded agent-platform-api (not release-named).
            # The bridge asks it which Discord channels mirror a Relay channel
            # (docs/design/19) — bindings are rows an operator edits in the UI,
            # so they must reach the connector without a redeploy.
            - name: AP_API_URL
              value: "http://agent-platform-api:8000"
            # A platform API token with a read role. OPTIONAL, and the chart
            # does not create the secret: without it the connector cannot ask
            # for bindings, so channel mirroring stays off and the
            # mention-the-bot thread flow runs alone.
            - name: AP_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: connector-discord-api
                  key: token
                  optional: true
          resources:
            requests: {memory: 128Mi, cpu: 50m}
            limits: {memory: 256Mi}
{{- end }}
