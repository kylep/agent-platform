---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Release.Name }}-dispatcher
  labels:
    {{- include "agent-platform.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ .Release.Name }}-dispatcher
  labels:
    {{- include "agent-platform.labels" . | nindent 4 }}
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "get", "list", "watch", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  # Workload identity (docs/design/13 A): the launcher lazily creates one
  # zero-RBAC ServiceAccount per agent so run pods can mount a projected,
  # audience-bound identity token.
  - apiGroups: [""]
    resources: ["serviceaccounts"]
    verbs: ["get", "create"]
  # Read the github-app secret to mint installation tokens for self-edit runs;
  # create/update the app-<name>-db / app-<name>-key secrets the app
  # provisioner materializes from apps/<name>/app.yaml (docs/design/11).
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "create", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Release.Name }}-dispatcher
  labels:
    {{- include "agent-platform.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ .Release.Name }}-dispatcher
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: Role
  name: {{ .Release.Name }}-dispatcher
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Release.Name }}-api
  labels:
    {{- include "agent-platform.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ .Release.Name }}-api
  labels:
    {{- include "agent-platform.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "create", "update"]
  # The /apps registry reports each app Deployment's readiness (design/11).
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Release.Name }}-api
  labels:
    {{- include "agent-platform.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ .Release.Name }}-api
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: Role
  name: {{ .Release.Name }}-api
  apiGroup: rbac.authorization.k8s.io
---
# tool-executor (docs/design/12): fetches a tool's DECLARED secrets at call
# time so nothing is env-baked into any pod. Read-only on secrets; namespace-
# wide get is the same concentration the dispatcher already has (it can
# create/update them) — tightening to provisioner-managed resourceNames is a
# design/13 follow-up.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Release.Name }}-tool-executor
  labels:
    {{- include "agent-platform.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ .Release.Name }}-tool-executor
  labels:
    {{- include "agent-platform.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Release.Name }}-tool-executor
  labels:
    {{- include "agent-platform.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ .Release.Name }}-tool-executor
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: Role
  name: {{ .Release.Name }}-tool-executor
  apiGroup: rbac.authorization.k8s.io
---
# Workload identity (docs/design/13 A): the api validates projected SA tokens
# via TokenReview, which needs the cluster-scoped auth-delegator role.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ .Release.Name }}-api-auth-delegator
  labels:
    {{- include "agent-platform.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ .Release.Name }}-api
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: ClusterRole
  name: system:auth-delegator
  apiGroup: rbac.authorization.k8s.io
---
# Identity-only SA for the MCP broker (design/13 B): zero RBAC, exists so
# SPIRE can attest the pod to spiffe://<td>/ns/<ns>/sa/<release>-mcp-broker.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Release.Name }}-mcp-broker
  labels:
    {{- include "agent-platform.labels" . | nindent 4 }}
