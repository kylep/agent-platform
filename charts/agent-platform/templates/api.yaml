apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-api
  labels:
    {{- include "agent-platform.selectorLabels" (dict "Release" .Release "Chart" .Chart "component" "api") | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "agent-platform.selectorLabels" (dict "Release" .Release "Chart" .Chart "component" "api") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "agent-platform.selectorLabels" (dict "Release" .Release "Chart" .Chart "component" "api") | nindent 8 }}
    spec:
      serviceAccountName: {{ .Release.Name }}-api
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: "{{ .Values.images.backend.repository }}:{{ .Values.images.backend.tag }}"
          imagePullPolicy: {{ .Values.images.backend.pullPolicy | default "IfNotPresent" }}
          command: ["python", "-m", "agentplatform.api_main"]
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            # Numeric uid/gid (the image's `nobody`): kubelet can't verify a
            # non-numeric USER name against runAsNonRoot.
            runAsUser: 65534
            runAsGroup: 65534
            capabilities:
              drop: ["ALL"]
          ports:
            - name: http
              containerPort: 8000
          env:
            {{- include "agent-platform.backendEnv" . | nindent 12 }}
            - name: AP_SESSION_SECRET
              value: {{ required "env.AP_SESSION_SECRET is required (e.g. --set env.AP_SESSION_SECRET=...)" .Values.env.AP_SESSION_SECRET | quote }}
            # The tool-executor, for `internal` tools the api runs itself
            # (docs/design/23). Under SPIRE the hop leaves through the local
            # client tunnel below, the same shape as the broker's.
            - name: AP_EXECUTOR_URL
              {{- if .Values.spire.enabled }}
              value: "http://127.0.0.1:8301"
              {{- else }}
              value: "http://agent-platform-tool-executor:8000"
              {{- end }}
            {{- if or (and .Values.claudeProxy.enabled .Values.claudeProxy.quota.enabled) .Values.codexProxy.enabled }}
            # Shared credential for the broker-only internal API routes.
            - name: AP_INTERNAL_SECRET
              value: {{ required "env.AP_INTERNAL_SECRET is required when an OAuth/quota broker is enabled (e.g. --set env.AP_INTERNAL_SECRET=...)" .Values.env.AP_INTERNAL_SECRET | quote }}
            {{- end }}
          volumeMounts:
            - name: agent-definitions
              mountPath: /agents
              readOnly: true
          resources:
            {{- toYaml .Values.resources.api | nindent 12 }}
        {{- if .Values.spire.enabled }}
        # Egress tunnel to the executor: api code talks plain HTTP to
        # localhost:8301; this wraps it in mTLS pinned to the executor's SVID.
        - name: executor-tunnel
          image: {{ .Values.spire.ghostunnelImage | quote }}
          args:
            - client
            - --listen=127.0.0.1:8301
            - --target=agent-platform-tool-executor:8443
            - --use-workload-api-addr={{ .Values.spire.workloadApiSocket }}
            - --verify-uri=spiffe://{{ .Values.spire.trustDomain }}/ns/{{ .Release.Namespace }}/sa/{{ .Release.Name }}-tool-executor
            - --status=http://0.0.0.0:8302
          # Same gate as the run pods' mcp-tunnel: a fresh pod can beat its
          # SPIRE entry, and client-mode /_status only passes once a full TLS
          # connection to the executor has succeeded (SVID in hand, server
          # cert verified) — so the tunnel is not Ready while it would fail.
          startupProbe:
            httpGet: {path: /_status, port: 8302}
            periodSeconds: 2
            failureThreshold: 60
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 1001
            runAsGroup: 1001
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          volumeMounts:
            - name: spiffe-workload-api
              mountPath: /spiffe-workload-api
              readOnly: true
          resources:
            requests: {memory: 32Mi, cpu: 10m}
            limits: {memory: 64Mi}
        {{- end }}
      volumes:
        - name: agent-definitions
          persistentVolumeClaim:
            claimName: {{ .Values.env.AP_AGENTS_VOLUME_CLAIM }}
        {{- if .Values.spire.enabled }}
        - name: spiffe-workload-api
          csi:
            driver: csi.spiffe.io
            readOnly: true
        {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  # Hardcoded: services/web/nginx.conf proxies /api/ to http://agent-platform-api:8000
  # by this literal DNS name, so it cannot be release-name-templated.
  name: agent-platform-api
  labels:
    {{- include "agent-platform.selectorLabels" (dict "Release" .Release "Chart" .Chart "component" "api") | nindent 4 }}
spec:
  selector:
    {{- include "agent-platform.selectorLabels" (dict "Release" .Release "Chart" .Chart "component" "api") | nindent 4 }}
  ports:
    - name: http
      port: 8000
      targetPort: 8000
