apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-dispatcher
  labels:
    {{- include "agent-platform.selectorLabels" (dict "Release" .Release "Chart" .Chart "component" "dispatcher") | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "agent-platform.selectorLabels" (dict "Release" .Release "Chart" .Chart "component" "dispatcher") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "agent-platform.selectorLabels" (dict "Release" .Release "Chart" .Chart "component" "dispatcher") | nindent 8 }}
    spec:
      serviceAccountName: {{ .Release.Name }}-dispatcher
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: dispatcher
          image: "{{ .Values.images.backend.repository }}:{{ .Values.images.backend.tag }}"
          imagePullPolicy: {{ .Values.images.backend.pullPolicy | default "IfNotPresent" }}
          command: ["python", "-m", "agentplatform.dispatcher_main"]
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
            capabilities:
              drop: ["ALL"]
          env:
            {{- include "agent-platform.backendEnv" . | nindent 12 }}
            {{- if or (and .Values.claudeProxy.enabled .Values.claudeProxy.quota.enabled) .Values.codexProxy.enabled }}
            # A rapid-chat's quota gate probes the proxies (docs/design/45).
            - name: AP_INTERNAL_SECRET
              value: {{ required "env.AP_INTERNAL_SECRET is required when an OAuth/quota broker is enabled (e.g. --set env.AP_INTERNAL_SECRET=...)" .Values.env.AP_INTERNAL_SECRET | quote }}
            {{- end }}
          volumeMounts:
            - name: api-identity
              mountPath: /var/run/ap-identity
              readOnly: true
            - name: agent-definitions
              mountPath: /agents
              readOnly: true
          resources:
            {{- toYaml .Values.resources.dispatcher | nindent 12 }}
      volumes:
        - name: api-identity
          projected:
            sources:
              - serviceAccountToken:
                  path: token
                  audience: agent-platform
                  expirationSeconds: 3600
        - name: agent-definitions
          persistentVolumeClaim:
            claimName: {{ .Values.env.AP_AGENTS_VOLUME_CLAIM }}
