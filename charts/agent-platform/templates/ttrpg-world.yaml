{{- if .Values.legacyTtrpgWorld.keep }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Release.Name }}-ttrpg-world
  annotations:
    helm.sh/resource-policy: keep
  labels:
    {{- include "agent-platform.labels" . | nindent 4 }}
spec:
  accessModes: [ReadWriteOnce]
  {{- if .Values.legacyTtrpgWorld.storageClass }}
  storageClassName: {{ .Values.legacyTtrpgWorld.storageClass }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.legacyTtrpgWorld.storage }}
{{- end }}
