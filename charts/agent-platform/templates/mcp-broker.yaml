apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-mcp-broker
  labels:
    {{- include "agent-platform.selectorLabels" (dict "Release" .Release "Chart" .Chart "component" "mcp-broker") | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "agent-platform.selectorLabels" (dict "Release" .Release "Chart" .Chart "component" "mcp-broker") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "agent-platform.selectorLabels" (dict "Release" .Release "Chart" .Chart "component" "mcp-broker") | nindent 8 }}
    spec:
      # This pod never calls the k8s API — don't mount a ServiceAccount token.
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mcp-broker
          image: "{{ .Values.mcpBroker.image.repository }}:{{ .Values.mcpBroker.image.tag }}"
          imagePullPolicy: {{ .Values.mcpBroker.image.pullPolicy | default "IfNotPresent" }}
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 1001
            runAsGroup: 1001
            capabilities:
              drop: ["ALL"]
          env:
            # The api Service is hardcoded agent-platform-api (not release-named).
            - name: AP_API_URL
              value: "http://agent-platform-api:8000"
            - name: AP_EXECUTOR_URL
              value: "http://agent-platform-tool-executor:8000"
            - name: AP_TOOLS_ROOT
              value: "/agents/tools"
            # Audit events (design/13 E) ride Kafka; the dispatcher-side
            # consumer writes them. Computed like backendEnv's, NOT from
            # .Values.env (which never carried this key).
            - name: AP_KAFKA_BOOTSTRAP
              value: "{{ .Release.Name }}-kafka:9092"
          ports:
            - containerPort: 8000
          readinessProbe:
            tcpSocket: {port: 8000}
            initialDelaySeconds: 3
            periodSeconds: 10
          volumeMounts:
            # Custom tools (docs/design/12): the broker reads tools/*/tool.yaml
            # from the synced checkout to register them dynamically.
            - name: agent-definitions
              mountPath: /agents
              readOnly: true
          resources:
            requests: {memory: 128Mi, cpu: 50m}
            limits: {memory: 256Mi}
      volumes:
        - name: agent-definitions
          persistentVolumeClaim:
            claimName: {{ .Values.env.AP_AGENTS_VOLUME_CLAIM }}
---
apiVersion: v1
kind: Service
metadata:
  # Hardcoded (like agent-platform-api) so the DNS name matches the runner's
  # default AP_MCP_URL (config.mcp_broker_url) rather than the release name.
  name: agent-platform-mcp-broker
  labels:
    {{- include "agent-platform.selectorLabels" (dict "Release" .Release "Chart" .Chart "component" "mcp-broker") | nindent 4 }}
spec:
  selector:
    {{- include "agent-platform.selectorLabels" (dict "Release" .Release "Chart" .Chart "component" "mcp-broker") | nindent 4 }}
  ports:
    - port: 8000
      targetPort: 8000
