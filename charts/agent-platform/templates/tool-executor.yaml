# Tool executor (docs/design/12): the ONLY place custom platform tools run.
# The mcp-broker is its only permitted client (netpol) and forwards verified
# caller identity, never credentials. It reads tools/ from the synced checkout
# volume, so tool edits are live without touching this image — only new pip
# deps require a rebuild (they're baked in by the Dockerfile).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-tool-executor
  labels:
    {{- include "agent-platform.selectorLabels" (dict "Release" .Release "Chart" .Chart "component" "tool-executor") | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "agent-platform.selectorLabels" (dict "Release" .Release "Chart" .Chart "component" "tool-executor") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "agent-platform.selectorLabels" (dict "Release" .Release "Chart" .Chart "component" "tool-executor") | nindent 8 }}
    spec:
      # Needs the k8s API: it fetches a tool's declared secrets at call time
      # (nothing is baked into this pod's env — see rbac.yaml).
      serviceAccountName: {{ .Release.Name }}-tool-executor
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: tool-executor
          image: "{{ .Values.toolExecutor.image.repository }}:{{ .Values.toolExecutor.image.tag }}"
          imagePullPolicy: {{ .Values.toolExecutor.image.pullPolicy | default "IfNotPresent" }}
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 1001
            runAsGroup: 1001
            capabilities:
              drop: ["ALL"]
          env:
            - name: AP_TOOLS_ROOT
              value: "/agents/tools"
            {{- if .Values.spire.enabled }}
            # mTLS mode (design/13 B): only the ghostunnel sidecar reaches this.
            - name: AP_BIND_HOST
              value: "127.0.0.1"
            {{- end }}
          ports:
            - containerPort: 8000
          readinessProbe:
            {{- if .Values.spire.enabled }}
            exec:
              command: ["python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=2)"]
            {{- else }}
            httpGet: {path: /healthz, port: 8000}
            {{- end }}
            initialDelaySeconds: 3
            periodSeconds: 10
          volumeMounts:
            - name: agent-definitions
              mountPath: /agents
              readOnly: true
          resources:
            requests: {memory: 128Mi, cpu: 50m}
            limits: {memory: 512Mi}
        {{- if .Values.spire.enabled }}
        # mTLS front door: ONLY the broker's SVID may connect (design/13 B).
        - name: mtls-server
          image: {{ .Values.spire.ghostunnelImage | quote }}
          args:
            - server
            - --listen=0.0.0.0:8443
            - --target=127.0.0.1:8000
            - --status=http://0.0.0.0:8302
            - --use-workload-api-addr={{ .Values.spire.workloadApiSocket }}
            - --allow-uri=spiffe://{{ .Values.spire.trustDomain }}/ns/{{ .Release.Namespace }}/sa/{{ .Release.Name }}-mcp-broker
          ports:
            - containerPort: 8443
          readinessProbe:
            httpGet: {path: /_status, port: 8302}
            initialDelaySeconds: 2
            periodSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 1001
            runAsGroup: 1001
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          volumeMounts:
            - name: spiffe-workload-api
              mountPath: /spiffe-workload-api
              readOnly: true
          resources:
            requests: {memory: 32Mi, cpu: 10m}
            limits: {memory: 64Mi}
        {{- end }}
      volumes:
        - name: agent-definitions
          persistentVolumeClaim:
            claimName: {{ .Values.env.AP_AGENTS_VOLUME_CLAIM }}
        {{- if .Values.spire.enabled }}
        - name: spiffe-workload-api
          csi:
            driver: csi.spiffe.io
            readOnly: true
        {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  # Hardcoded to match the broker's default AP_EXECUTOR_URL.
  name: agent-platform-tool-executor
  labels:
    {{- include "agent-platform.selectorLabels" (dict "Release" .Release "Chart" .Chart "component" "tool-executor") | nindent 4 }}
spec:
  selector:
    {{- include "agent-platform.selectorLabels" (dict "Release" .Release "Chart" .Chart "component" "tool-executor") | nindent 4 }}
  ports:
    {{- if .Values.spire.enabled }}
    - port: 8443
      targetPort: 8443
    {{- else }}
    - port: 8000
      targetPort: 8000
    {{- end }}
