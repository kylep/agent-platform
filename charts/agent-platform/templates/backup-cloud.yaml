{{- if and .Values.backup.enabled .Values.backup.cloud.enabled }}
# The cloud backup is a separate Job from the legacy local pg_dump. It captures
# the database and namespace Opaque Secrets, encrypts one portable archive,
# then uploads ciphertext using a write-only Cloud Storage credential.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Release.Name }}-cloud-backup
  labels:
    {{- include "agent-platform.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ .Release.Name }}-cloud-backup
  labels:
    {{- include "agent-platform.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Release.Name }}-cloud-backup
  labels:
    {{- include "agent-platform.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ .Release.Name }}-cloud-backup
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: Role
  name: {{ .Release.Name }}-cloud-backup
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ .Release.Name }}-cloud-backup
  labels:
    {{- include "agent-platform.labels" . | nindent 4 }}
spec:
  schedule: {{ .Values.backup.cloud.schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            {{- include "agent-platform.selectorLabels" (dict "Release" .Release "Chart" .Chart "component" "cloud-backup") | nindent 12 }}
        spec:
          restartPolicy: Never
          serviceAccountName: {{ .Release.Name }}-cloud-backup
          securityContext:
            seccompProfile: {type: RuntimeDefault}
            fsGroup: 1001
          initContainers:
            - name: database-dump
              image: "{{ .Values.backup.image.registry }}/{{ .Values.backup.image.repository }}:{{ .Values.backup.image.tag }}"
              imagePullPolicy: {{ .Values.backup.image.pullPolicy | default "IfNotPresent" }}
              command: ["/bin/bash", "-c"]
              args:
                - |
                  set -euo pipefail
                  pg_dump --no-owner --no-acl | gzip > /work/database.sql.gz.tmp
                  gzip -t /work/database.sql.gz.tmp
                  mv /work/database.sql.gz.tmp /work/database.sql.gz
              env:
                - {name: PGHOST, value: "{{ .Release.Name }}-postgresql"}
                - {name: PGPORT, value: "5432"}
                - {name: PGUSER, value: "postgres"}
                - {name: PGDATABASE, value: {{ .Values.postgresql.auth.database | quote }}}
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef: {name: {{ .Release.Name }}-postgresql, key: postgres-password}
              securityContext:
                allowPrivilegeEscalation: false
                runAsNonRoot: true
                runAsUser: 1001
                runAsGroup: 1001
                capabilities: {drop: ["ALL"]}
              volumeMounts:
                - {name: work, mountPath: /work}
          containers:
            - name: encrypted-upload
              image: "{{ .Values.images.backend.repository }}:{{ .Values.images.backend.tag }}"
              imagePullPolicy: {{ .Values.images.backend.pullPolicy | default "IfNotPresent" }}
              command: ["python", "-m", "agentplatform.backup_export"]
              env:
                - {name: AP_K8S_NAMESPACE, value: {{ .Release.Namespace | quote }}}
                - {name: AP_BACKUP_CONNECTION_DIR, value: /backup-connection}
                - {name: AP_BACKUP_OUTPUT_DIR, value: /backups}
                - {name: AP_BACKUP_DUMP_PATH, value: /work/database.sql.gz}
                - {name: AP_BACKUP_LOCAL_KEEP, value: {{ .Values.backup.keep | quote }}}
              securityContext:
                allowPrivilegeEscalation: false
                runAsNonRoot: true
                runAsUser: 1001
                runAsGroup: 1001
                capabilities: {drop: ["ALL"]}
              resources:
                requests: {memory: 128Mi, cpu: 50m}
                limits: {memory: 512Mi}
              volumeMounts:
                # Export appends the restore marker to this private dump copy
                # before encrypting it; the source database is unchanged.
                - {name: work, mountPath: /work}
                - {name: backups, mountPath: /backups}
                - {name: connection, mountPath: /backup-connection, readOnly: true}
          volumes:
            - name: work
              emptyDir: {sizeLimit: 1Gi}
            - name: backups
              persistentVolumeClaim: {claimName: {{ .Release.Name }}-pg-backups}
            - name: connection
              secret: {secretName: {{ .Values.backup.cloud.connectionSecret }}}
{{- end }}
