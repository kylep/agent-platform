{{- if or (and .Values.claudeProxy.enabled .Values.claudeProxy.quota.enabled) .Values.codexProxy.enabled }}
# The proxy -> API credential for the quota snapshot push (docs/design/22).
# It is mounted as a file rather than injected as an env var so a rotation
# reaches the running proxy through the kubelet's volume sync, exactly like the
# Claude token; the API compares it constant-time and answers a uniform 401.
# No default: like AP_SESSION_SECRET it lives in the stored values, never in git.
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-internal
  labels:
    {{- include "agent-platform.labels" . | nindent 4 }}
type: Opaque
stringData:
  quota: {{ required "env.AP_INTERNAL_SECRET is required when an OAuth/quota broker is enabled (e.g. --set env.AP_INTERNAL_SECRET=...)" .Values.env.AP_INTERNAL_SECRET | quote }}
{{- end }}
