{{- if .Values.village.enabled }}
# The village engine (GEN-11, docs/superpowers/plans/2026-11-27-village-game.md
# §1, §3.1): the single writer of the game world. Recreate (never two pods at
# once during a rollout) plus a Postgres advisory lock in main.py (never two
# writers if something else goes wrong). One image, one more Deployment: restart
# it with the other three after a backend deploy.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-village
  labels:
    {{- include "agent-platform.selectorLabels" (dict "Release" .Release "Chart" .Chart "component" "village") | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "agent-platform.selectorLabels" (dict "Release" .Release "Chart" .Chart "component" "village") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "agent-platform.selectorLabels" (dict "Release" .Release "Chart" .Chart "component" "village") | nindent 8 }}
    spec:
      # Starts runs with materialize_run (Postgres + Kafka), never the k8s API.
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: village
          image: "{{ .Values.images.backend.repository }}:{{ .Values.images.backend.tag }}"
          imagePullPolicy: {{ .Values.images.backend.pullPolicy | default "IfNotPresent" }}
          command: ["python", "-m", "agentplatform.village.main"]
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
            capabilities:
              drop: ["ALL"]
          ports:
            - name: commands
              containerPort: {{ .Values.village.port }}
          env:
            {{- include "agent-platform.backendEnv" . | nindent 12 }}
            - name: AP_VILLAGE_PORT
              value: {{ .Values.village.port | quote }}
            {{- if .Values.env.AP_INTERNAL_SECRET }}
            # The session-close prompt-section write goes through the API's internal route.
            - name: AP_INTERNAL_SECRET
              value: {{ .Values.env.AP_INTERNAL_SECRET | quote }}
            {{- end }}
          # The synced checkout: materialize_run reads the tool registry from it.
          volumeMounts:
            - name: agent-definitions
              mountPath: /agents
              readOnly: true
          resources:
            {{- toYaml .Values.village.resources | nindent 12 }}
      volumes:
        - name: agent-definitions
          persistentVolumeClaim:
            claimName: {{ .Values.env.AP_AGENTS_VOLUME_CLAIM }}
---
apiVersion: v1
kind: Service
metadata:
  # Literal name, like agent-platform-api: tools/village and the tool-executor
  # address it as http://agent-platform-village:<port>.
  name: agent-platform-village
  labels:
    {{- include "agent-platform.selectorLabels" (dict "Release" .Release "Chart" .Chart "component" "village") | nindent 4 }}
spec:
  selector:
    {{- include "agent-platform.selectorLabels" (dict "Release" .Release "Chart" .Chart "component" "village") | nindent 4 }}
  ports:
    - name: commands
      port: {{ .Values.village.port }}
      targetPort: commands
{{- end }}
